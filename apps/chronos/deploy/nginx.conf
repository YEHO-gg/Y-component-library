# /etc/nginx/sites-available/chronos
#
# 纯静态站点：把仓库里的 apps/chronos/ 放到 /var/www/chronos 即可。
# 零依赖、零构建、不外链任何资源，所以这里只需要管缓存和安全头。
#
# ⚠️ 一个重要陷阱，改这个文件前务必读：
#   nginx 的 add_header 是"就近继承"——只要某个 location 里出现了**任何一条**
#   add_header，这个 location 就不再继承 server 级的 add_header。
#   所以下面所有 location 都刻意**不写 add_header**，缓存全部用 expires 表达
#   （expires 自己会发 Cache-Control）。这样 server 级的 CSP / nosniff /
#   Referrer-Policy / X-Frame-Options 才能对每个响应都生效。
#   要加新的自定义头，请加在 server 级，或者每个 location 里重写一遍全套。

server {
    listen 80;
    listen [::]:80;
    server_name chronos.example.com;

    # 用 certbot 之后把 80 全部跳 443；没有证书时先留着这条注释
    # return 301 https://$host$request_uri;

    root /var/www/chronos;
    index index.html;
    charset utf-8;

    # 单页、没有前端路由：找不到就回首页，而不是给 404 页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存：expires -1 → Cache-Control: no-cache（改完刷新即生效）
    location = /index.html {
        expires -1;
    }

    # 文件名不带 hash，所以别给 immutable；7 天足够
    location ~* \.(css|js)$ {
        expires 7d;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        access_log off;
    }

    # 站点不请求任何外部资源，CSP 可以收得很紧。
    # 只有一处需要 'unsafe-inline'：index.html 头部的主题预置脚本（必须在首帧前跑，没法外链）。
    # 页面里没有任何 style 属性或 <style> 标签，所以 style-src 不需要放开；
    # 图标是行内 data: SVG，由 img-src data: 覆盖。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 没有后端，日志意义有限，但保留 error_log 方便排查
    access_log /var/log/nginx/chronos.access.log;
    error_log  /var/log/nginx/chronos.error.log warn;
}

# HTTPS：拿到证书后取消下面的注释，并把上面 listen 80 改成跳转
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name chronos.example.com;
#     ssl_certificate     /etc/letsencrypt/live/chronos.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/chronos.example.com/privkey.pem;
#     include /etc/letsencrypt/options-ssl-nginx.conf;
#     ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#     root /var/www/chronos;
#     index index.html;
#     # 其余 location / 缓存 / 安全头 / gzip 与上面一致
# }
