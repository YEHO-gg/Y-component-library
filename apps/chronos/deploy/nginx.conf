# /etc/nginx/sites-available/chronos
#
# 纯静态站点：把仓库里的 apps/chronos/ 放到 /var/www/chronos 即可。
# 零依赖、零构建、不外链任何资源，所以这里只需要管缓存和安全头。

server {
    listen 80;
    listen [::]:80;
    server_name chronos.example.com;

    # 用 certbot 之后把 80 全部跳 443；没有证书时先留着这条注释
    # return 301 https://$host$request_uri;

    root /var/www/chronos;
    index index.html;

    # 单页、没有前端路由：找不到就回首页，而不是给 404 页
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML 不缓存，改完立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 文件名不带 hash，所以别给 immutable；7 天足够
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 站点不请求任何外部资源，CSP 可以收得很紧。
    # 需要 'unsafe-inline' 的两处：index.html 头部的主题预置脚本、行内 SVG data URI。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 没有后端，日志意义有限，但保留 error_log 方便排查
    access_log /var/log/nginx/chronos.access.log;
    error_log  /var/log/nginx/chronos.error.log warn;
}

# HTTPS：拿到证书后取消下面的注释，并把上面 listen 80 改成跳转
