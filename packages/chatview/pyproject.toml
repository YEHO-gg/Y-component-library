[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ycomponent"
version = "0.1.0"
description = "PySide6 widgets that survive long lists — currently a QListView-based chat transcript view."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YEHO-gg" }]
keywords = ["pyside6", "qt", "chat", "qlistview", "delegate", "widget"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["PySide6>=6.6"]

[project.urls]
Homepage = "https://github.com/YEHO-gg/Y-component-library"
Issues = "https://github.com/YEHO-gg/Y-component-library/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ycomponent*"]
