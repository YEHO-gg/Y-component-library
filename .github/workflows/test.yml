name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "PySide6>=6.6" pytest
      - name: headless smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q